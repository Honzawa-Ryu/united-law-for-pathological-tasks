  caption: RGB→法線の出力。人物の輪郭と机の面が出ている。カラーマップ表示で、通常の RGB 法線マップの見た目ではない
  representative: true
- path: outputs/0001_20261121_wsm_infer_smoke/dense-000038__480__demo/input.png
  caption: 意味セグメンテーションの入力（ライオンの写真）
notes: 1 回目（24265）は wsg_reader サブモジュール未取得で失敗。サブモジュールを取得して再実行した。失敗でも sacct は COMPLETED と出る。
