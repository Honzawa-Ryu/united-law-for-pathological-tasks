title: '著者の分類枝（VAE 潜在表現 + 小さな CNN）で BRACS を分類'
status: 完了
purpose: WSM の論文（3.6 節）が分類に使っている構成を BRACS の 7 クラス分類にそのまま当て、色の多数決方式や UNI2-h + 線形と比べる。
method: 著者の分類器（約 154 万パラメータの CNN）を、H&E 画像の FLUX.2 VAE 潜在表現を入力にして、著者のスクリプトの既定値（3000 ステップ、50 ステップごとに val、balanced accuracy 最良の重みを採用）で学習した。10 倍と 20 倍、各 3 シード。この分類器はトンネルも生成結果も使わない。著者のコードは分割をハッシュで作り直すので、公式分割を使うよう修正した。
results:
- '10 倍: val 0.523 / 0.498、test 0.426 / 0.400（正解率 / macro-F1、3 シードの平均。出典: outputs/0013_*/bracs_cls_10x__seed*/results.json）'
- '20 倍: val 0.450 / 0.422、test 0.415 / 0.382'
- 'test の macro-F1 の幅: 10 倍 0.382〜0.429、20 倍 0.380〜0.384'
- '色の多数決方式（test macro-F1 0.545〜0.570）と UNI2-h + 線形（0.573〜0.600）より 0.15〜0.2 低い'
- '学習損失は下限近くまで下がるが val の損失は 1.4〜1.5 で、学習データに過適合している。最良の重みは 100〜2300 ステップとばらつく'
