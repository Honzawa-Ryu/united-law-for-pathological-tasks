title: H&E 画像とマスクの VAE 往復
status: 完了
purpose: FLUX.2 の VAE に H&E 画像とマスク画像を通して戻しても、核などの情報が残るかを学習なしで確かめる。
method: BRACS val の ROI 中央から 512 px のタイルを 40 / 20 / 10 倍で切り、VAE で符号化・復号した。核マスクはヘマトキシリン成分の大津二値化で代用した。
results:
- '40 倍（291 タイル）: PSNR 33.7、SSIM 0.947、核領域の Dice 0.939、マスク往復の Dice 0.9993（出典: outputs/0003_*/40x/results.json）'
- '20 倍（215 タイル）: PSNR 29.9、SSIM 0.931、核領域の Dice 0.909、マスク往復の Dice 0.9959'
- '10 倍（88 タイル）: PSNR 27.4、SSIM 0.916、核領域の Dice 0.877、マスク往復の Dice 0.9911'
- 核マスクは正解注釈ではなく自動二値化の代用。UNI 埋め込みでの比較は未実施
