title: BRACS の分類の評価
status: 完了
purpose: 学習したトンネルの分類精度を val / test で測り、UNI2-h の線形分類（0007）と比べる。
method: 学習済みトンネルで ROI を 10 ステップ生成し、復号した画像の各画素を最も近いクラス色に読み替えて多数決で 1 クラスに決めた。条件は val（312 枚）で選び、test（570 枚）は各モデル 1 回。
results:
- 'test の macro-F1: WSM 20 倍 + UNI 9000 ステップ 0.570、WSM 10 倍 9000 ステップ 0.557、WSM 20 倍 9000 ステップ 0.545（いずれもバッチ 4。出典: outputs/0006_*/*__test__ckpt-final/results.json）'
- 比較対象の UNI2-h + 線形は test の macro-F1 0.573（範囲 1024）/ 0.600（範囲 2048）。WSM は並ぶが上回らない
- val の macro-F1 は バッチ 1・3000 ステップで 0.406、バッチ 4・3000 ステップで 0.535、バッチ 4・9000 ステップで 0.598（10 倍）
- 推論はシードに対して安定（同じモデルを 3 シードで評価して正解率 0.458 が一致）。1 枚 4.7 秒
- 生成画像はほぼ単色（最多色が画素の 99%）。誤りは色の読み替えではなく、どの色を出すかの判断にある
