title: BCSS を WSM の学習用 latent に変換
status: 完了
purpose: 組織セグメンテーション（BCSS）を WSM に学習させるための入力を作る。
method: ROI 151 枚を 20 倍相当（0.5 µm/px）に縮小し、512 px のタイルに重なりなしで切った。22 コードを 5 クラスにまとめ、クラスの色で塗り分けた画像を目標にした。分割は施設単位。
results:
- 'タイル 1591 枚: train 1025（91 スライド）/ val 116（15）/ test 450（44）（出典: outputs/0009_*/20x/results.json）'
- '画素の割合: 腫瘍 0.378、間質 0.342、炎症 0.121、壊死 0.061、その他 0.052、評価から除く領域 0.047'
- Google Drive で取れなかったマスク 1 枚は figshare から取得。元の倍率（7622×4738）だったので画像の大きさ（6313×3924）に最近傍で合わせた
- test の施設の組（OL、LL、E2、EW、GM、S3）は記憶に基づく指定で、公式ベースラインのページでは未確認
figures:
