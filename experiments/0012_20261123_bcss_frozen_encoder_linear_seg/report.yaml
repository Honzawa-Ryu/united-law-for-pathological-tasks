title: '比較対象: 凍結エンコーダ + 線形デコーダ（BCSS）'
status: 完了（UNI2-h は取得できず未実施）
purpose: WSM のセグメンテーションと比べる基準として、凍結した ViT の特徴に線形の層を載せた場合の精度を測る。
method: 0009 と同じタイル・分割・正解で、ViT のパッチ特徴（入力 518 px、37×37 トークン）に 1×1 畳み込みを載せて 40 エポック学習し、val の mIoU が最良のエポックを採用した。
results:
- 'DINOv2 ViT-L/14: val 0.783 / 0.569、test 0.795 / 0.580（画素正解率 / mIoU）、test の平均 Dice 0.727（出典: outputs/0012_*/dinov2_vitl14/results.json）'
- 'test のクラス別 IoU: 腫瘍 0.749、間質 0.676、炎症 0.541、壊死 0.534、その他 0.402'
- 学習は 4 分、特徴抽出は 0.066 秒/タイル。最良エポックが最終の 40 で、延ばせば上がる可能性がある
- UNI2-h は認証エラー（401）で取得できなかった。計算ノードに Hugging Face のトークンが無い
