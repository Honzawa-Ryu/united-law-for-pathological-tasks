title: BRACS の分類トンネルの学習
status: 完了
purpose: WSM のトンネルを BRACS の 7 クラス分類（RGB → クラス色の画像）で学習できるか、どの条件で安定するかを確かめる。
method: 学習スクリプトを直接呼び、凍結した FLUX.2 Klein 4B に LoRA rank 8（学習対象 1250 万パラメータ）を学習させた。倍率、バッチサイズ、ステップ数、補助損失、UNI2-h 特徴の条件追加を変えて 13 通り実行した。
results:
- 'バッチ 1 は約 3.1 秒/ステップ、VRAM 18 GB。バッチ 4 は約 5.3 秒/ステップ、VRAM 44 GB（A6000 の上限。出典: outputs/0005_*/*/results.json）'
- 検証損失はどの条件も 0.140〜0.145 で横ばいになり、分類の精度を反映しなかった（精度は 0006 を参照）
- バッチ 1 は 250 ステップ違うだけで val の正解率が 0.19 ↔ 0.35 と揺れた。バッチ 4 は延長で伸び続けた
- UNI2-h の ROI 特徴は、音声条件用の経路で条件トークン / 変調として渡せた（学習対象 1270 万 / 3610 万パラメータ）
- 横取り 2 回、ホストメモリ不足 1 回、制限時間切れ 2 回。いずれも保存済みの状態から再開した
figures:
- path: outputs/0005_20261122_bracs_wsm_train_cls/bracs_cls_20x__steps9000__bs4/stats.png
  caption: 20 倍・バッチ 4・9000 ステップの学習曲線。学習損失は最初の数百ステップで 0.5 前後まで下がり、その後はほぼ横ばい。検証損失も 0.14 付近で平らなまま
  representative: true
notes: 再開用の状態は検証損失が改善したときだけ保存される。制限時間で切られると、最後に改善した時点まで戻る。
